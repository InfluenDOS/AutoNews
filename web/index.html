<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AutoNews — 按关键词订阅新闻，自动匹配相关报道并译成中文，收藏感兴趣的文章。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <title>AutoNews · 关键词新闻</title>
    <script>
      // Apply the saved style and light/dark choice before first paint (see ThemeContext).
      (function () {
        var root = document.documentElement
        try {
          var mode = localStorage.getItem('autonews-theme-v3')
          if (mode === 'light' || mode === 'dark') root.dataset.theme = mode
          var skin = localStorage.getItem('autonews-skin-v3')
          root.dataset.skin = skin === 'bamboo' ? 'bamboo' : 'wire'
          if (skin === 'bamboo') {
            var link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = 'https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css'
            link.setAttribute('data-skin-font', 'bamboo')
            document.head.appendChild(link)
          }
        } catch (e) {
          root.dataset.skin = 'wire'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
