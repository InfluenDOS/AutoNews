name: Tests

on:
  push:
    branches: [main]
    paths:
      - crawler/**
      - web/**
      - .github/workflows/test.yml
  pull_request:
  workflow_dispatch:

jobs:
  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install dependencies
        run: pip install -r crawler/requirements.txt
      - name: Run crawler tests
        working-directory: crawler
        run: |
          set -e
          for t in test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Matching and story-grouping parity tests
        run: npm test
