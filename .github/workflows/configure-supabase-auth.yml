name: Configure Supabase auth and deploy signup function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-supabase-auth.yml
      - supabase/functions/web-signup/**

jobs:
  configure-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure auth (disable email confirmation)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: lmhxbkhanptelqltayzj
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is missing — skip auth config."
            echo "Add a token from https://supabase.com/dashboard/account/tokens"
            exit 0
          fi

          echo "Updating Supabase auth config..."
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "mailer_autoconfirm": true,
              "site_url": "https://speechlessgorilla.com",
              "uri_allow_list": "https://speechlessgorilla.com"
            }' | tee /tmp/auth-config.json

          if jq -e '.message? // empty' /tmp/auth-config.json >/dev/null 2>&1; then
            echo "Auth config update may have failed:"
            cat /tmp/auth-config.json
            exit 1
          fi
          echo "Auth config updated."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy web-signup edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: lmhxbkhanptelqltayzj
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is missing — skip function deploy."
            exit 0
          fi
          supabase functions deploy web-signup \
            --project-ref "${PROJECT_REF}" \
            --no-verify-jwt
