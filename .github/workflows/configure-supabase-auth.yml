name: Configure Supabase auth and deploy scheduler function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-supabase-auth.yml
      - supabase/functions/schedule-dispatch/**

jobs:
  configure-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure auth (email confirmation + Turnstile captcha)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          PROJECT_REF: lmhxbkhanptelqltayzj
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is missing — skip auth config."
            echo "Add a token from https://supabase.com/dashboard/account/tokens"
            exit 0
          fi

          echo "Updating Supabase auth config..."
          # New accounts must confirm their email. The captcha is switched on only
          # when its secret exists; the site must already ship the matching site key
          # (repo variable VITE_TURNSTILE_SITE_KEY), or every sign-in would fail.
          jq -n --arg secret "${TURNSTILE_SECRET_KEY:-}" '{
              mailer_autoconfirm: false,
              site_url: "https://speechlessgorilla.com",
              uri_allow_list: "https://speechlessgorilla.com"
            } + (if $secret == "" then {} else {
              security_captcha_enabled: true,
              security_captcha_provider: "turnstile",
              security_captcha_secret: $secret
            } end)' > /tmp/auth-body.json
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/auth-body.json > /tmp/auth-config.json

          if jq -e '.message? // empty' /tmp/auth-config.json >/dev/null 2>&1; then
            echo "Auth config update may have failed:"
            jq -r '.message' /tmp/auth-config.json
            exit 1
          fi
          echo "Auth config updated."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: lmhxbkhanptelqltayzj
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is missing — skip function deploy."
            exit 0
          fi
          supabase functions deploy schedule-dispatch \
            --project-ref "${PROJECT_REF}"
