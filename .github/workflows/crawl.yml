name: Crawl keyword news RSS

on:
  schedule:
    # Fixed hourly crawl (independent of on-demand runs from Edge Function)
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Downloading article bodies adds a few minutes over RSS-only crawling.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: AI expand keywords
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          export AI_BASE_URL="${AI_BASE_URL:-https://api.deepseek.com}"
          export AI_MODEL="${AI_MODEL:-deepseek-chat}"
          python process_ai.py --keywords-only

      - name: Crawl RSS (match + relevance)
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # Relevance now reads article bodies: smaller batches, but it decides every
          # shortlisted pair rather than only multi-facet keywords. Verdicts are cached
          # per (keyword, article), so steady-state cost is just newly published articles.
          RELEVANCE_BATCH_SIZE: "6"
          RELEVANCE_MAX_PER_RUN: "240"
          BODY_FETCH_MAX: "300"
          BODY_FETCH_CONCURRENCY: "12"
        run: |
          export AI_BASE_URL="${AI_BASE_URL:-https://api.deepseek.com}"
          export AI_MODEL="${AI_MODEL:-deepseek-chat}"
          python crawl.py

      - name: Translate matched articles
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          export AI_BASE_URL="${AI_BASE_URL:-https://api.deepseek.com}"
          export AI_MODEL="${AI_MODEL:-deepseek-chat}"
          python process_ai.py --translate-only
