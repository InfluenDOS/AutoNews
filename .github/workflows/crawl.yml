name: Crawl keyword news RSS

on:
  schedule:
    # Avoid GitHub Actions' high-load period at the top of each hour.
    # Fixed hourly crawl (independent of on-demand runs from Edge Function).
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: crawl-keyword-news
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Downloading article bodies adds a few minutes over RSS-only crawling.
    timeout-minutes: 30
    env:
      # Stream progress lines as they happen instead of all at step exit.
      PYTHONUNBUFFERED: "1"
    steps:
      # The Supabase watchdog dispatches this workflow every hour; GitHub's own schedule
      # is the fallback and often fires minutes after it, which crawled (and paid for
      # the AI calls) twice in that hour. A scheduled run right after another one stops.
      - name: Skip if a crawl just ran
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-40 minutes' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/${{ github.repository }}/actions/workflows/crawl.yml/runs?per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .created_at >= \"$since\")] | length")
          echo "Other crawl runs since $since: $recent"
          if [ "$recent" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r crawler/requirements.txt

      - name: AI expand keywords
        if: steps.gate.outputs.skip != 'true'
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          export AI_BASE_URL="${AI_BASE_URL:-https://api.deepseek.com}"
          export AI_MODEL="${AI_MODEL:-deepseek-flash}"
          echo "AI model: ${AI_MODEL}"
          python process_ai.py --keywords-only

      - name: Crawl RSS (match + relevance)
        if: steps.gate.outputs.skip != 'true'
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          # Topic shortlist (place-only is not enough), then AI reads bodies.
          # Verdicts are cached per (keyword, article); a retract pass drops
          # historical entertainment / off-country / place-only false positives.
          RELEVANCE_BATCH_SIZE: "6"
          RELEVANCE_MAX_PER_RUN: "240"
          BODY_FETCH_MAX: "300"
          CANDIDATE_STORE_MAX: "400"
          BODY_FETCH_CONCURRENCY: "12"
        run: |
          export AI_BASE_URL="${AI_BASE_URL:-https://api.deepseek.com}"
          export AI_MODEL="${AI_MODEL:-deepseek-flash}"
          echo "AI model: ${AI_MODEL}"
          python crawl.py

      - name: Translate matched articles
        if: steps.gate.outputs.skip != 'true'
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          export AI_BASE_URL="${AI_BASE_URL:-https://api.deepseek.com}"
          export AI_MODEL="${AI_MODEL:-deepseek-flash}"
          echo "AI model: ${AI_MODEL}"
          python process_ai.py --translate-only
