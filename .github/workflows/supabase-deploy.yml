name: Deploy Supabase changes

# Manual: apply one SQL migration and/or redeploy edge functions. With both inputs
# blank it only reports what is recorded and deployed.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: File in supabase/migrations to apply, e.g. 022_keyword_sources.sql (blank = none)
        required: false
        default: ""
      functions:
        description: Edge functions to deploy, space-separated (blank = none)
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: lmhxbkhanptelqltayzj
      API: https://api.supabase.com/v1/projects/lmhxbkhanptelqltayzj
    steps:
      - uses: actions/checkout@v4

      - name: Report recorded migrations and deployed functions
        run: |
          set -euo pipefail
          q() { jq -n --arg q "$1" '{query:$q}' | curl -sS -X POST "$API/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @-; }
          echo "Last recorded migrations:"
          q "select version, name from supabase_migrations.schema_migrations order by version desc limit 5" | jq -c '.'
          echo "Deployed functions:"
          curl -sS "$API/functions" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -c '.[] | {slug, version, verify_jwt, updated_at}'

      - name: Apply migration
        if: inputs.migration != ''
        env:
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          [[ "$MIGRATION" =~ ^[0-9]{3}_[a-z0-9_]+\.sql$ ]] || { echo "bad migration name: $MIGRATION"; exit 1; }
          file="supabase/migrations/$MIGRATION"
          [ -f "$file" ] || { echo "no such file: $file"; exit 1; }
          q() { jq -n --arg q "$1" '{query:$q}' | curl -sS -X POST "$API/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @-; }
          out=$(q "$(cat "$file")")
          echo "$out"
          if echo "$out" | jq -e 'type == "object" and has("message")' >/dev/null; then exit 1; fi
          version="${MIGRATION%%_*}"
          name="${MIGRATION#*_}"; name="${name%.sql}"
          # Record it so `supabase db push` will not run it again (README step 1).
          q "insert into supabase_migrations.schema_migrations (version, name)
             values ('$version', '$name') on conflict (version) do nothing" | jq -c '.'

      - uses: supabase/setup-cli@v1
        if: inputs.functions != ''
        with:
          version: latest

      - name: Deploy functions
        if: inputs.functions != ''
        env:
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          for f in $FUNCTIONS; do
            [[ "$f" =~ ^[a-z0-9-]+$ && -d "supabase/functions/$f" ]] || { echo "unknown function: $f"; exit 1; }
            # Keep whatever JWT setting the live function has.
            verify=$(curl -sS "$API/functions/$f" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.verify_jwt // true')
            flag=""
            [ "$verify" = "false" ] && flag="--no-verify-jwt"
            echo "Deploying $f (verify_jwt=$verify)"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" $flag
          done
          curl -sS "$API/functions" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -c '.[] | {slug, version, verify_jwt, updated_at}'
