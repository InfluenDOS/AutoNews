name: Clean up old unstarred articles

on:
  schedule:
    # Budapest midnight is 22:00 UTC in summer and 23:00 UTC in winter.
    # Run both candidates; the script's timezone gate executes only the right one.
    - cron: "7 22,23 * * *"
  workflow_dispatch:

concurrency:
  group: cleanup-article-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Purge articles older than 20 days unless starred
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTICLE_RETENTION_DAYS: "20"
          RETENTION_TIMEZONE: Europe/Budapest
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python cleanup_retention.py --scheduled
          else
            python cleanup_retention.py
          fi
